apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}

  labels:
    app: nginx
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}

spec:

  type: {{ .Values.service.type }}

  selector:
    app: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:

    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http